<header class="cc-navbar">
  <nav class="cc-navbar__inner">

    <!-- Brand -->
    <a class="cc-brand" routerLink="/">
      <span class="cc-brand__dot"></span>
      <span class="cc-brand__name">Conecta Care</span>
    </a>

    <!-- Desktop nav -->
    <ul class="cc-nav__links" [class.cc-nav__links--open]="mobileOpen()">
      @if (valid()) {
        @for (link of links; track link.route) {
          <li>
            <a class="cc-nav__link"
               [routerLink]="link.route"
               routerLinkActive="cc-nav__link--active"
               (click)="mobileOpen.set(false)">
              <i [class]="link.icon + ' cc-nav__icon'"></i>
              {{ link.label }}
            </a>
          </li>
        }
        <li>
          <p-button
            label="Sair"
            icon="pi pi-sign-out"
            severity="danger"
            [text]="true"
            size="small"
            (onClick)="logout()" />
        </li>
      } @else {
        <li>
          <a class="cc-nav__link"
             routerLink="/cadastro"
             routerLinkActive="cc-nav__link--active"
             (click)="mobileOpen.set(false)">
            <i class="pi pi-user-plus cc-nav__icon"></i>
            Cadastre-se
          </a>
        </li>
        <li>
          <p-button
            label="Login"
            icon="pi pi-sign-in"
            size="small"
            routerLink="/login"
            (click)="mobileOpen.set(false)" />
        </li>
      }
    </ul>

    <!-- Mobile hamburger -->
    <p-button
      class="cc-hamburger"
      [icon]="mobileOpen() ? 'pi pi-times' : 'pi pi-bars'"
      [text]="true"
      [rounded]="true"
      [attr.aria-expanded]="mobileOpen()"
      aria-label="Menu"
      (onClick)="toggleMobile()" />

  </nav>
</header>
