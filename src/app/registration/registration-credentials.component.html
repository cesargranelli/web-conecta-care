<div class="wrapper wrapper-full-page">
  <div class="page-header login-page">
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-7 col-sm-9 ml-auto mr-auto">
          <form (ngSubmit)="onSubmit()" [formGroup]="form">
            <div class="card card-login">
              <div class="card-header card-header-rose text-center">
                <div class="social-line">
                  <i class="material-icons">fingerprint</i>
                  <h4 class="card-title">Login Information</h4>
                </div>
              </div>
              <div class="col-lg-12 col-md-12 col-sm-8 ml-auto mr-auto">

                <div class="form-row justify-content-center form-control-lg">
                  <div class="col-lg-10 col-md-10 col-sm-8">
                    <div [ngClass]="inputHas.validation(form.controls['email'])" class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="material-icons">email</i></span>
                      </div>
                      <input autocomplete="off" class="form-control" formControlName="email" placeholder="Email" type="email">
                      <span class="form-control-feedback">
                        <i class="material-icons">{{ input.validation(form.controls['email']) }}</i>
                      </span>
                    </div>
                  </div>
                </div>

                <div class="form-row justify-content-center form-control-lg">
                  <div class="col-lg-10 col-md-10 col-sm-8">
                    <div [ngClass]="inputHas.validation(form.controls['confirmEmail'])" class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="material-icons">email</i></span>
                      </div>
                      <input autocomplete="off" class="form-control" formControlName="confirmEmail" placeholder="Confirm Email" type="email">
                      <span class="form-control-feedback">
                        <i class="material-icons">{{ input.validation(form.controls['confirmEmail']) }}</i>
                      </span>
                    </div>
                  </div>
                </div>

                <div class="form-row justify-content-center form-control-lg">
                  <div class="col-lg-10 col-md-10 col-sm-8">
                    <div [ngClass]="inputHas.validation(form.controls['password'])" class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="material-icons">lock_outline</i></span>
                      </div>
                      <input class="form-control" formControlName="password" placeholder="Password" type="password">
                      <span class="form-control-feedback">
                        <i class="material-icons">{{ input.validation(form.controls['password']) }}</i>
                      </span>
                    </div>
                  </div>
                </div>

                <div class="form-row justify-content-center form-control-lg">
                  <div class="col-lg-10 col-md-10 col-sm-8">
                    <div [ngClass]="inputHas.validation(form.controls['confirmPassword'])" class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text"><i class="material-icons">lock_outline</i></span>
                      </div>
                      <input class="form-control" formControlName="confirmPassword" placeholder="Confirm Password" type="password">
                      <span class="form-control-feedback">
                        <i class="material-icons">{{ input.validation(form.controls['confirmPassword']) }}</i>
                      </span>
                    </div>
                  </div>
                </div>

                <app-form-password-validation [password]="form.controls['password'].value">
                </app-form-password-validation>

              </div>

              <div class="card-footer justify-content-center">
                <div class="col-lg-10 col-md-11 col-sm-12">
                  <div class="form-check">
                    <label class="form-check-label">
                      <input formControlName="terms" class="form-check-input" type="checkbox">
                      I have read and agree to the
                      <a target="_blank" href="/termo-e-condicoes-de-uso"><u>Terms of Use</u></a> and
                      <a target="_blank" href="/politica-de-privacidade"><u>Privacy Policy</u></a>.
                      <span class="form-check-sign"><span class="check"></span></span>
                    </label>
                  </div>
                </div>
              </div>

              <div class="card-footer justify-content-between">
                <span class="bmd-form-group is-filled">
                  <button [routerLink]="['/']" class="btn btn-gray" type="button">Cancel</button>
                </span>
                <span class="bmd-form-group is-filled">
                  <button [disabled]="form.invalid" class="btn btn-rose" type="submit">Submit</button>
                </span>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
